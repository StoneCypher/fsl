name: Feature request
description: Suggest an idea or request a feature (bug reports go elsewhere)
labels: ["Enhancement"]
body:

  - type: textarea
    id: feature
    attributes:
      label: So what's the feature?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is this related to a problem?  If so, what?
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context as you see fit
    validations:
      required: false
